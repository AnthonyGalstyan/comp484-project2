<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Your Giga Pet</title>
    <meta
      name="description"
      content="A simple virtual pet game made with JavaScript and jQuery"
    >
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header>
      <h1>This is your Giga Pet</h1>
      <p>Take care of your pet and keep its stats healthy!</p>
    </header>

    <main>
      <section class="pet-image-container">
        <img
          class="pet-image"
          src="images/pet.jpg"
          alt="My Giga Pet"
        >
      </section>

      <section class="dashboard">
        <h2>Pet Dashboard</h2>

        <div>
          Name:
          <strong><span class="name"></span></strong>
        </div>

        <div>
          Weight:
          <strong><span class="weight"></span> pounds</strong>
        </div>

        <div>
          Happiness:
          <strong>
            <span class="happiness"></span> tail wags (per min)
          </strong>
        </div>

        <!-- New stat connected to the Nap action -->
        <div>
          Energy:
          <strong><span class="energy"></span>%</strong>
        </div>

        <!-- Pet comments appear here instead of using alert() or console.log() -->
        <p class="pet-message">
          Your pet is waiting for you!
        </p>

        <!-- Displays the number of buttons found with .children() -->
        <p>
          Available actions:
          <strong><span class="action-count"></span></strong>
        </p>

        <div class="button-container">
          <button class="treat-button">
            Treat
          </button>

          <button class="play-button">
            Play
          </button>

          <button class="exercise-button">
            Exercise
          </button>

          <!-- New required action -->
          <button class="nap-button">
            Nap
          </button>
        </div>
      </section>
    </main>

    <footer>
      <p>Take good care of your Giga Pet!</p>
    </footer>

    <!-- jQuery Library -->
    <script
      src="https://code.jquery.com/jquery-2.2.1.min.js"
      integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
      crossorigin="anonymous"
    ></script>
  </body>
</html>
